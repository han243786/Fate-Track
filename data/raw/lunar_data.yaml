# Lunar Calendar Skip Table (HKO data 1901-2100)
# Fast O(1) query: year hash → month walk (≤13 steps)
#
# QUERY: Gregorian (Y, M, D) → Lunar (month, day, leap?)
#   1. e = years[str(Y)];  if (M,D) < e.base: e = years[str(Y-1)]
#   2. days = date_diff((M,D), e.base)
#   3. for i, len in enumerate(e.m):
#        if days < abs(len): month=i+1, day=days+1, leap=(len<0); break
#        days -= abs(len)
#
# FIELDS:
#   gz   = Gan-Zhi of lunar year (干支年)
#   zo   = Zodiac (生肖)
#   base = [month, day] of 正月 初一 in this Gregorian year
#   m    = Lunar month day-counts: 29/30, negative = leap month
#   s    = Solar terms as day-of-year offsets, 0 = none

