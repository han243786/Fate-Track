<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>命轨工作台</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="side-desk" aria-label="起盘侧栏">
        <header class="topbar">
          <div class="brand-lockup">
            <h1>命轨排盘</h1>
          </div>
        </header>

        <section class="panel form-panel" aria-labelledby="chart-form-title">
          <div class="panel-heading">
            <h2 id="chart-form-title">命主资料</h2>
          </div>
          <div class="form-grid birth-grid">
            <label class="field">
              <span>公历日期</span>
              <input id="chart-date" type="date" />
            </label>
            <label class="field">
              <span>出生时间</span>
              <input id="chart-time" type="time" />
            </label>
            <label class="field">
              <span>性别</span>
              <select id="chart-sex">
                <option value="unspecified">未指定</option>
                <option value="male">男</option>
                <option value="female">女</option>
              </select>
            </label>
          </div>
          <dl class="lunar-inline" id="lunar-inline">
            <div><dt>农历</dt><dd id="lunar-display">--</dd></div>
          </dl>
          <div class="action-row">
            <button id="chart-run-button" type="button">排盘</button>
            <button id="chart-report-button" type="button">查看命盘报告</button>
          </div>
        </section>
      </aside>

      <main class="workspace">
        <section class="panel chart-panel" aria-labelledby="chart-title">
          <div class="panel-heading">
            <h2 id="chart-title">四柱命盘</h2>
          </div>
          <div class="chart-board" aria-label="四柱排盘结果">
            <dl class="pillar-grid" id="pillar-grid"></dl>
          </div>
        </section>

        <section class="panel luck-panel" aria-labelledby="luck-title">
          <div class="panel-heading">
            <h2 id="luck-title">大运排盘</h2>
          </div>
          <div id="luck-cycles" class="luck-cycles"></div>
        </section>

        <div class="analysis-cards" id="analysis-cards"></div>

        <section class="panel analysis-panel" aria-labelledby="analysis-title">
          <div class="panel-heading">
            <h2 id="analysis-title">格局分析</h2>
          </div>
          <div class="metric-columns" id="analysis-metrics"></div>
        </section>

      </main>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
