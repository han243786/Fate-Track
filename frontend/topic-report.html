<!doctype html>
<html lang="zh-CN" class="report-root" data-report-theme="main">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>专项报告 - 命轨</title>
    <script>
      (() => {
        const wuxingThemes = new Set(["metal", "wood", "water", "fire", "earth"]);
        const savedTheme = localStorage.getItem("ft-wuxing-theme");
        document.documentElement.dataset.reportTheme = "main";
        document.documentElement.dataset.wuxingTheme = wuxingThemes.has(savedTheme) ? savedTheme : "water";
      })();
    </script>
    <link rel="stylesheet" href="./src/styles.css" />
    <link rel="stylesheet" href="./src/report-themes.css" />
  </head>

  <body class="report-body">
    <header class="report-header" aria-label="专项报告导航">
      <a class="report-back" href="/">← 返回排盘</a>
      <div class="report-brand" aria-label="命轨专项报告">
        <strong id="topic-report-brand-title">专项报告</strong>
        <span>命轨专项报告</span>
      </div>
      <div class="report-progress-label" id="report-progress-label">阅读进度 · 00%</div>
      <i class="report-progress" id="report-progress" aria-hidden="true"></i>
    </header>

    <main class="report-page" id="topic-report-page">
      <p class="empty-state">正在整理专项报告…</p>
    </main>

    <script type="module" src="./src/topic-report-page.js"></script>
  </body>
</html>
